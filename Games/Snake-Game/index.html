<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🐍 Snake Game</h1>

    <!-- Canvas container -->
    <div class="canvasContainer">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Scoreboard (absolute to right) -->
    <div class="scoreBoard">
        <h2>Score</h2>
        <p id="currentScore">0</p>
        <h2>High Score</h2>
        <p id="highScore">0</p>
    </div>

    <!-- Back button -->
    <button id="backButton" onclick="window.location.href='../'">Back to Gallery</button>
    
    <script src="script.js"></script>
</body>
</html>
